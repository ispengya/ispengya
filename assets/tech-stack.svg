<svg xmlns="http://www.w3.org/2000/svg" width="424" height="164" viewBox="0 0 424 164" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1e05a"/>
      <stop offset="50%" stop-color="#b07219"/>
      <stop offset="100%" stop-color="#00ADD8"/>
    </linearGradient>
  </defs>

  <rect width="424" height="164" rx="10" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="423" height="163" rx="9.5" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <rect x="24" y="42" width="48" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="24" y="32" font-size="15" font-weight="600" fill="#e6edf3">Tech Stack</text>
  <text x="400" y="32" font-size="11" fill="#8b949e" text-anchor="end">后端基础设施 · 网络编程 · 中间件</text>

  <!-- row 1 -->
  <g font-size="14" fill="#e6edf3">
    <rect x="24" y="60" width="108" height="34" rx="17" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
    <text x="40" y="82" font-size="15">☕</text><text x="66" y="82">Java</text>

    <rect x="144" y="60" width="92" height="34" rx="17" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
    <text x="160" y="82" font-size="15">🐹</text><text x="186" y="82">Go</text>

    <rect x="248" y="60" width="118" height="34" rx="17" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
    <text x="264" y="82" font-size="15">🌱</text><text x="290" y="82">Spring</text>
  </g>

  <!-- row 2 -->
  <g font-size="14" fill="#e6edf3">
    <rect x="24" y="106" width="110" height="34" rx="17" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
    <text x="40" y="128" font-size="15">⚡</text><text x="66" y="128">Netty</text>

    <rect x="146" y="106" width="114" height="34" rx="17" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
    <text x="162" y="128" font-size="15">🗄️</text><text x="190" y="128">MySQL</text>

    <rect x="272" y="106" width="128" height="34" rx="17" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)"/>
    <text x="288" y="128" font-size="15">🔀</text><text x="314" y="128">分库分表</text>
  </g>
</svg>
